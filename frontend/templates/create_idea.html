
{% extends "base.html" %}

{% block content %}
<main class="container px-2 px-md-3 py-4" style="max-width: 760px;">
    <a href="/ideas" class="text-secondary text-decoration-none small">
        <i class="bi bi-arrow-left me-1"></i> К идеям
    </a>

    <h1 class="h3 mb-2">Создать идею</h1>
    <p class="text-secondary mb-4">Расскажи об идее и найди единомышленников.</p>

    <form action="/ideas/create" method="POST"
          class="p-3 p-md-4 rounded-4 border" style="background:#161b22;">

        <div class="mb-3">
            <label for="title" class="form-label">Название</label>
            <input class="form-control" id="title" name="title"
                   maxlength="150" required>
        </div>

        <div class="mb-3">
            <label for="short_description" class="form-label">Краткое описание</label>
            <textarea class="form-control" id="short_description"
                      name="short_description" rows="2"
                      maxlength="300" required></textarea>
        </div>

        <div class="mb-3">
            <label for="description" class="form-label">Подробное описание</label>
            <textarea class="form-control" id="description"
                      name="description" rows="4" required></textarea>
        </div>

        <div class="mb-4">
            <label for="role_input" class="form-label">Нужные роли</label>

            <div class="input-group">
                <input class="form-control" id="role_input"
                       maxlength="50"
                       placeholder="Например, Python-разработчик">
                <button class="btn btn-outline-primary" type="button" id="add_role">
                    <i class="bi bi-plus-lg"></i> Добавить тег
                </button>
            </div>

            <div id="role_tags" class="d-flex flex-wrap gap-2 mt-2"></div>
            <div id="role_error" class="small text-danger mt-2" role="alert"></div>
            <div id="role_hidden"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Ссылки на положение и материалы</label>

            <div id="links_container" class="d-flex flex-column gap-2">
                <div class="input-group">
                    <input class="form-control" name="reference_links"
                           type="url" placeholder="https://..."
                           pattern="https?://.+" 
                           title="Укажите ссылку, начинающуюся с http:// или https://">
                    <button class="btn btn-outline-secondary" type="button"
                            disabled aria-label="Удалить ссылку">
                        <i class="bi bi-link-45deg"></i>
                    </button>
                </div>
            </div>

            <button class="btn btn-sm btn-outline-secondary mt-2"
                    type="button" id="add_link">
                <i class="bi bi-plus-lg me-1"></i> Добавить ссылку
            </button>
        </div>

        <div class="mb-3">
            <label for="deadline" class="form-label">Дедлайн</label>
            <input class="form-control" type="date"
                   id="deadline" name="deadline">
            <div class="form-text">Необязательно.</div>
        </div>

        <div class="mb-4">
            <label for="region" class="form-label">Регион проведения</label>
            <input class="form-control" id="region" name="region"
                   placeholder="Например, Рига">
            <div class="form-text">Оставь пустым, если проект проходит онлайн.</div>
        </div>

        <div class="d-flex flex-column flex-sm-row justify-content-end gap-2">
            <a href="/ideas" class="btn btn-outline-secondary">Отмена</a>
            <button class="btn btn-primary" type="submit">
                <i class="bi bi-plus-circle me-1"></i> Создать проект
            </button>
        </div>
    </form>
</main>

<script>
    const roleInput = document.getElementById("role_input");
    const roleTags = document.getElementById("role_tags");
    const roleHidden = document.getElementById("role_hidden");
    const roleError = document.getElementById("role_error");
    const roles = new Set();

    document.getElementById("add_role").addEventListener("click", () => {
        const role = roleInput.value.trim();

        if (!role) return;

        if (roles.has(role.toLowerCase())) {
            roleError.textContent = "Такая роль уже добавлена.";
            return;
        }

        if (roles.size >= 10) {
            roleError.textContent = "Можно добавить не более 10 ролей.";
            return;
        }

        roles.add(role.toLowerCase());
        roleError.textContent = "";

        const tag = document.createElement("span");
        tag.className = "idea-tag";

        const label = document.createElement("span");
        label.textContent = role;

        const remove = document.createElement("button");
        remove.type = "button";
        remove.className = "btn-close btn-close-white";
        remove.style.fontSize = ".6rem";
        remove.setAttribute("aria-label", "Удалить " + role);

        const hidden = document.createElement("input");
        hidden.type = "hidden";
        hidden.name = "roles";
        hidden.value = role;

        remove.addEventListener("click", () => {
            roles.delete(role.toLowerCase());
            tag.remove();
            hidden.remove();
        });

        tag.append(label, remove);
        roleTags.appendChild(tag);
        roleHidden.appendChild(hidden);

        roleInput.value = "";
    });

    roleInput.addEventListener("keydown", event => {
        if (event.key === "Enter") {
            event.preventDefault();
            document.getElementById("add_role").click();
        }
    });

    document.getElementById("add_link").addEventListener("click", () => {
        const group = document.createElement("div");
        group.className = "input-group";

        const input = document.createElement("input");
        input.className = "form-control";
        input.name = "reference_links";
        input.type = "url";
        input.placeholder = "https://...";
        input.pattern = "https?://.+";
        input.title = "Укажите ссылку, начинающуюся с http:// или https://";

        const remove = document.createElement("button");
        remove.type = "button";
        remove.className = "btn btn-outline-secondary";
        remove.setAttribute("aria-label", "Удалить ссылку");
        remove.innerHTML = '<i class="bi bi-trash"></i>';

        remove.addEventListener("click", () => group.remove());

        group.append(input, remove);
        document.getElementById("links_container").appendChild(group);
        input.focus();
    });

    const deadline = document.getElementById("deadline");
    const today = new Date();
    const localToday = new Date(
        today.getTime() - today.getTimezoneOffset() * 60000
    ).toISOString().split("T")[0];

    deadline.min = localToday;
</script>

{% endblock %}
