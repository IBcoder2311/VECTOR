    role="alert">

    <p class="mb-0 mt-1">
        Делись идеями, находи единомышленников и собирай команду для своих проектов.
    </p>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Закрыть"></button>
</div>

<h1 class="mb-3">Идеи</h1>

<div class="card">
    <div class="card-body">

        <h5 class="card-title">Название идеи</h5>

        <hr>

        <p class="card-text">Короткое описание</p>

        <div class="d-flex justify-content-between align-items-center mt-3">
            <div class="d-flex flex-wrap gap-1">
                <span class="idea-tag">Python</span>
                <span class="idea-tag">Веб-разработка</span>
            </div>

            <small class="text-secondary">
                <i class="bi bi-people"></i> 5 откликов
            </small>
        </div>

        <div class="mt-3">
            <a href="/ideas/123" class="btn btn-outline-primary btn-sm">
                Подробнее <i class="bi bi-arrow-right"></i>
            </a>
        </div>

    </div>
</div>

<script>
    const welcomeAlert = document.getElementById("welcome-alert");
    const storageKey = "vector-welcome-hidden";

    if (welcomeAlert && localStorage.getItem(storageKey) === "true") {
        welcomeAlert.remove();
    }

    if (welcomeAlert) {
        welcomeAlert.addEventListener("closed.bs.alert", () => {
            localStorage.setItem(storageKey, "true");
        });
    }
</script>
