<!DOCTYPE html>
<html lang="ru" data-bs-theme="dark">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="/static/theme.js?v=20261106-2"></script>
    <link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/static/style.css?v=20261106-2">

    <title>{% block title %} {{ title }} {% endblock %}</title>
</head>
<body>

    <header class="py-3 mb-3 border-bottom">
        <div class="container-fluid d-grid gap-3 align-items-center" style="grid-template-columns: 1fr 2fr;">
            <div class="dropdown">
                <a href="/">
                    <img src="/static/img/logo.png" alt="ВЕКТОР" height="42">
                </a>
            </div>

            <div class="d-flex align-items-center">
                <form class="flex-grow-1 me-3" role="search"
                    action="/search" method="get">
                    <div class="input-group search-group">
                        <input
                            type="search"
                            class="form-control search-input"
                            placeholder="Поиск идей..."
                            aria-label="Поиск идей"
                            name="q"
                            value="{{ search_query or '' }}"
                        >
                        <button class="btn search-button" type="submit" aria-label="Найти">
                            <i class="bi bi-search"></i>
                        </button>
                    </div>
                </form>

                <div class="flex-shrink-0 dropdown">
                    <a href="#"
                        class="d-block link-body-emphasis text-decoration-none dropdown-toggle"
                        data-bs-toggle="dropdown"
                        aria-expanded="false">
                        <img
                            src="{{ request.session.get('user_img') or '/static/img/avatar.jpg' }}"
                            alt="Аватар пользователя"
                            class="rounded-circle flex-shrink-0"
                            width="32"
                            height="32"
                            style="object-fit: cover;"
                            onerror="this.onerror=null; this.src='/static/img/avatar.jpg';"
                        >
                    </a>

                    <ul class="dropdown-menu text-small shadow">
                        <li><a class="dropdown-item" href="/profile">Профиль</a></li>
                        <li><a class="dropdown-item" href="/settings">Настройки</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </header>

    <main class="container px-2 px-md-3">
        {% block content %}
        {% endblock %}
    </main>

    <nav class="bottom-navbar">
        <a href="/" class="bottom-nav-item {% if active_page == 'home' %}active{% endif %}">
            <i class="bi bi-house-door"></i>
            <span>Главная</span>
        </a>

        <a href="/ideas" class="bottom-nav-item {% if active_page == 'ideas' %}active{% endif %}">
            <i class="bi bi-lightbulb"></i>
            <span>Мои идеи</span>
        </a>

        <a href="/events" class="bottom-nav-item {% if active_page == 'events' %}active{% endif %}">
            <i class="bi bi-calendar-event"></i>
            <span>Мероприятия</span>
        </a>
    </nav>

    <script>
        const header = document.querySelector("header");
        let lastScrollY = window.scrollY;

        window.addEventListener("scroll", () => {
            const currentScrollY = window.scrollY;

            if (currentScrollY < 80) {
                header.classList.remove("header-hidden");
            } else if (currentScrollY > lastScrollY) {
                header.classList.add("header-hidden");
            } else if (currentScrollY < lastScrollY) {
                header.classList.remove("header-hidden");
            }

            lastScrollY = currentScrollY;
        }, { passive: true });

        function showToast(message, type = "success") {
            const colors = {
                success: "text-bg-success",
                error: "text-bg-danger",
                warning: "text-bg-warning",
                info: "text-bg-primary"
            };

            const toast = document.createElement("div");
            toast.className = `toast align-items-center ${colors[type] || colors.info} border-0`;
            toast.setAttribute("role", "alert");

            toast.innerHTML = `
                <div class="d-flex">
                    <div class="toast-body"></div>
                    <button type="button" class="btn-close btn-close-white me-2 m-auto"
                            data-bs-dismiss="toast"></button>
                </div>
            `;

            toast.querySelector(".toast-body").textContent = message;

            document.getElementById("toast-container").appendChild(toast);

            const instance = new bootstrap.Toast(toast, { delay: 3000 });
            instance.show();

            toast.addEventListener("hidden.bs.toast", () => toast.remove());
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <script src="https://st.max.ru/js/max-web-app.js"></script>
    <script src="/static/share.js?v=1"></script>

    {% if not request.session.get("user_id") %}
        <script src="/static/auth.js"></script>
    {% else %}
        <script src="/static/startapp.js"></script>
    {% endif %}

    <div id="toast-container"
         class="toast-container position-fixed bottom-0 end-0 p-3">
    </div>
    <script src="/static/categories.js"></script>

</body>
</html>
