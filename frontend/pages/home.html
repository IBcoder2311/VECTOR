<!DOCTYPE html>
<html lang="ru" data-bs-theme="dark" style="--bs-body-bg: #0d1117; ">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/frontend/static/style.css">
    <title>ВЕКТОР - главная страница</title>
</head>
<body>

    <header class="py-3 mb-3 border-bottom">
        <div class="container-fluid d-grid gap-3 align-items-center" style="grid-template-columns: 1fr 2fr;">
            <div class="dropdown">
                
               <a href="#">
                    <img src="/frontend/static/img/logo.png" alt="ВЕКТОР" height="42">
                </a>
                
            </div>
            <div class="d-flex align-items-center">
                
            <form class="flex-grow-1 me-3" role="search">
                <div class="input-group search-group">
                    <input
                        type="search"
                        class="form-control search-input"
                        placeholder="Поиск идей..."
                        aria-label="Поиск идей"
                    >
                    <button class="btn search-button" type="submit" aria-label="Найти">
                        <i class="bi bi-search"></i>
                    </button>
                </div>
            </form>

                <div class="flex-shrink-0 dropdown"> 
                    <a href="#"
                        class="d-block link-body-emphasis text-decoration-none dropdown-toggle" data-bs-toggle="dropdown"
                        aria-expanded="false"> 
                        <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" class="bi bi-person-fill rounded-circle" viewBox="0 0 16 16">
                            <path d="M3 14s-1 0-1-1 1-4 6-4 6 3 6 4-1 1-1 1zm5-6a3 3 0 1 0 0-6 3 3 0 0 0 0 6"></path>
                        </svg>
                    </a>

                    <ul class="dropdown-menu text-small shadow">
                        <li><a class="dropdown-item" href="#">Профиль</a></li>
                        <li><a class="dropdown-item" href="#">Настройки</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </header>

    <main class="container px-2 px-md-3">

        <div class="alert alert-dismissible fade show welcome-alert" role="alert">
            <strong>Добро пожаловать в ВЕКТОР!</strong>
            <p class="mb-0 mt-1">
                Делись идеями, находи единомышленников и собирай команду для своих проектов.
            </p>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Закрыть"></button>
        </div>

        <h1 class="mb-3">Идеи</h1>

        <!-- Когда пусто -->

        <!-- <div class="text-center py-5">
            <img
                src="/frontend/static/img/fox/fox_question.png"
                alt="Спящая лиса"
                class="empty-state-fox mb-3"
            >

            <h4>Пока здесь пусто</h4>
            <p class="text-secondary mb-4">
                Есть идея? Не держи её в голове — поделись ею с другими.
            </p>
        </div> -->

        <!-- Когда есть контент -->

        <div class="card">
            <div class="card-body">

                <h5 class="card-title">Название идеи</h5>

                <hr>

                <p class="card-text">Короткое описание</p>

                <div class="d-flex justify-content-between align-items-center mt-3">
                    <div class="d-flex flex-wrap gap-1">
                        <span class="idea-tag">Python</span>
                        <span class="idea-tag">Веб-разработка</span>
                    </div>
        
                    <small class="text-secondary">
                        <i class="bi bi-people"></i> 5 откликов
                    </small>
                </div>

                <div class="mt-3">
                    <a href="/ideas/123" class="btn btn-outline-primary btn-sm">
                        Подробнее <i class="bi bi-arrow-right"></i>
                    </a>
                </div>

            </div>
        </div>
        
        
    </main>

    <nav class="bottom-navbar">
        <a href="/" class="bottom-nav-item active">
            <i class="bi bi-house-door"></i>
            <span>Главная</span>
        </a>
    
        <a href="/ideas/create" class="bottom-nav-item">
            <i class="bi bi-plus-circle"></i>
            <span>Мои идеи</span>
        </a>
    
        <a href="/organizations" class="bottom-nav-item">
            <i class="bi bi-card-checklist"></i>
            <span>Мероприятия</span>
        </a>
    </nav>

    <script>
        const header = document.querySelector("header");
        let lastScrollY = window.scrollY;

        window.addEventListener("scroll", () => {
            const currentScrollY = window.scrollY;

            if (currentScrollY < 80) {
                header.classList.remove("header-hidden");
            } else if (currentScrollY > lastScrollY) {
                header.classList.add("header-hidden");
            } else if (currentScrollY < lastScrollY) {
                header.classList.remove("header-hidden");
            }

            lastScrollY = currentScrollY;
        }, { passive: true });

    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
